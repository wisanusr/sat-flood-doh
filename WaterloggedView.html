<script>
/* "น้ำขัง" tab: tambons where the waterlogging pipeline found standing water, with the district summary.
   Reads the flood_waterlogged and flood_waterlogged_amphoe sheet tabs (one row per tambon / per district with its 2P2R level) through
   window.dashboardData (published by dashboard.js) and redraws on the 'dashboard:data' event. Table paging, column filters
   and the table markup come from window.DashboardTables (dashboard.js), so this tab looks like the others.
   Both tabs are optional: when they cannot be read this tab says so and the rest of the dashboard is unaffected.
   Statuses, confidence and reasons are the pipeline's own; nothing here recomputes them. Not an official announcement. */
(function(){
  const M=window.DashboardModel;
  const tab=document.getElementById('tab-water'),pane=document.getElementById('waterPane');
  if(!M||!tab||!pane)return;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('th-TH',{maximumFractionDigits:d}):'–';
  // Table cells: zero shows as a dash, like a missing value (counts, days and areas read more easily without rows of 0).
  const num=(n,d=0)=>Number.isFinite(n)&&n!==0?fmt(n,d):'–';
  const tz={timeZone:'Asia/Bangkok'};
  const when=iso=>{const t=M.timestamp(iso);return Number.isFinite(t)?new Date(t).toLocaleString('th-TH',{...tz,day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' น.':'-'};
  const day=iso=>{const t=M.timestamp(iso);return Number.isFinite(t)?new Date(t).toLocaleDateString('th-TH',{...tz,day:'numeric',month:'short'}):'-'};
  const hoursText=h=>!Number.isFinite(h)?'–':h<1?'ไม่ถึง 1 ชม.':fmt(Math.floor(h))+' ชม.';
  const STATUSES=Object.keys(M.WATER_LOG_STATUS);
  const state={statuses:new Set(STATUSES),region:'',province:'',district:null,level:'',query:'',sel:null,note:null,provSel:null,showProv:true,unit:'amp',showRegion:true,showProvLine:true,showAmp:true,showProvName:true,showTambon:true};
  let map=null,ro=null,markers=new Map(),markerLayer=null,isOpen=false;

  const data=()=>window.dashboardData;
  const status=name=>data()?.sourceStatus?.[name];
  const key=r=>r.tb_idn||[r.province,r.district,r.subdistrict].join('|');
  const meta=s=>M.WATER_LOG_STATUS[String(s??'').trim()]||{color:'#94a3b8',short:String(s??'')};
  const rowsAll=()=>M.waterRows(data()?.floodWaterlogged);
  // 2P2R levels: district rows are the pipeline's (level_code decides the colour); province rows are built from them.
  // Both are empty when the tab is missing / empty / unreadable.
  const ampRows=()=>status('flood_waterlogged_amphoe')?.status==='ok'?M.waterAmphoeRows(data()?.floodWaterloggedAmphoe):[];
  const ampIndex=()=>new Map(ampRows().map(r=>[r.district_code,r]));
  const provRows=()=>M.waterProvinceRows(M.waterProvincesFromAmphoe(ampRows()));
  // District fill needs the district outlines; without them the map falls back to province colours.
  const ampFill=()=>!!window.AMPHOE_GEOJSON&&ampRows().length>0;
  const provIndex=()=>M.waterProvinceIndex(provRows());
  const provByName=name=>provRows().find(r=>r.province===name);
  // Every section reads the same scope (province, district, 2P2R level, search); the status toggles narrow the tambons only.
  // Data scale ("ระดับข้อมูล"): 'amp' = districts (map fill, 2P2R list and level filter by district), 'prov' = provinces.
  // District scale needs the district outlines; without them the page is at province scale.
  const unitNow=()=>ampFill()&&state.unit!=='prov'?'amp':'prov';
  // Health region (เขตสุขภาพ) of each province, from the vulnerable-group sheet the other tabs use for the same filter.
  const regionMap=()=>{const m=new Map();for(const r of data()?.vulnerable||[])if(r&&r.province&&r.region)m.set(r.province,r.region);return m};
  const regionProvinces=()=>{if(!state.region)return null;const out=[];for(const [p,g] of regionMap())if(g===state.region)out.push(p);return out};
  const scope=()=>M.waterScope(rowsAll(),ampRows(),{province:state.province,districtCode:state.district?.code,level:state.level,query:state.query,levelBy:unitNow()==='prov'?'province':'district',provinces:regionProvinces()});
  const scopeAmps=()=>M.waterDistricts(scope().amps);
  const visibleRows=()=>M.waterFilter(scope().tambons,{statuses:state.statuses});
  const selCode=()=>state.district?state.district.code:null;
  const LEVELS=['red','orange','yellow','green'];
  const stageOf=k=>M.WATER_2P2R[k]?.stage||k;

  function select(active){
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===active)));
    $('workspace').setAttribute('aria-labelledby',active.id);
  }
  function open(){isOpen=true;document.body.classList.add('water-mode');select(tab);if(tab.scrollIntoView)tab.scrollIntoView({block:'nearest',inline:'nearest'});render()}
  function close(e){isOpen=false;document.body.classList.remove('water-mode');if(e&&e.currentTarget)select(e.currentTarget)}

  const notice=(text,withRetry)=>'<section class="panel"><div class="panel-body"><div class="alert">'+text+'</div>'+(withRetry?'<p><button class="lightbtn" data-water-retry>ลองอ่านใหม่</button></p>':'')+'</div></section>';
  const card=(label,value,note,accent)=>'<article class="card '+(accent?'accent':'')+'"><div class="eyebrow">'+label+'</div><div class="number">'+fmt(value)+'</div><div class="card-note">'+note+'</div></article>';
  const label=s=>M.waterStatusLabel(s);
  // Status dot: filled in the status colour, or a hollow ring for "เคยพบน้ำ" (old water, drawn lighter on purpose).
  const dotCss=s=>{const m=meta(s);return m.hollow?'background:#fff;box-shadow:inset 0 0 0 2px '+m.color:'background:'+m.color};
  const dotted=s=>'<span class="badge water-badge"><i class="dot" style="'+dotCss(s)+'"></i>'+esc(label(s))+'</span>';
  // Small evidence badge for 'น้ำขัง' rows: "ยืนยันด้วยภาพ" (confidence สูง) / "ตาม ปภ." (กลาง); nothing for the other statuses.
  const confBadge=r=>{const c=M.waterIsLogged(r)&&M.waterConfidence(r);return c?'<span class="badge water-conf water-conf-'+c.key+'">'+esc(c.label)+'</span>':''};
  const statusCell=r=>dotted(r.status)+(confBadge(r)?' '+confBadge(r):'');
  // Hover card of a tambon (point or outline): status first, then ต. / อ. / จ. (แขวง / เขต in Bangkok). Names in the data
  // may already carry a prefix, so it is stripped before the right one is added.
  function placeLine(sub,dist,prov){
    const bkk=prov==='กรุงเทพมหานคร';
    const s=String(sub??'').replace(/^(ต\.|ตำบล|แขวง)\s*/,''),d=String(dist??'').replace(/^(อ\.|อำเภอ|เขต)\s*/,'');
    return '<b>'+(bkk?'แขวง':'ต.')+esc(s)+'</b><br>'+(d?(bkk?'เขต':'อ.')+esc(d)+' ':'')+(prov?(bkk?'':'จ.')+esc(prov):'');
  }
  function tambonTip(r){
    const c=M.waterIsLogged(r)&&M.waterConfidence(r);
    return '<span class="water-tip-status"><i class="dot" style="'+dotCss(r.status)+'"></i>'+esc(label(r.status))+(c?' · '+esc(c.label):'')+'</span><br>'+placeLine(r.subdistrict,r.district,r.province);
  }
  // District / province names for an outline that has no tambon row (from the district outlines).
  let ampNames=null;
  const ampName=code=>{if(!ampNames){ampNames=new Map();for(const f of window.AMPHOE_GEOJSON?.features||[])ampNames.set(M.waterAmpCode(f.properties.amp_code),f.properties)}return ampNames.get(M.waterAmpCode(code))||{}};

  // ---------- 1. freshness ----------
  function freshnessHtml(rows){
    const f=M.waterFreshness(rows,Date.now());
    const cls=f.runLevel==='bad'?'bad':f.runLevel==='warn'?'warn':'ok';
    let html='<div class="data-age age-'+(cls==='bad'?'bad':'warn')+'" role="status" style="display:block"><b>ความสดของข้อมูล</b> · ประมวลผลรอบล่าสุด '+when(f.runAt)+(f.runHours!=null?' (ผ่านมา '+hoursText(f.runHours)+')':'')
      +' · ภาพดาวเทียมที่พบน้ำล่าสุดมีอายุ '+hoursText(f.imageHours)+' ณ รอบประมวลผลนั้น'
      +'<br><span class="age-basis">ภาพดาวเทียมครอบคลุมเป็นบางส่วนของประเทศ และมาถึงล่าช้าประมาณ 1–2 วัน จังหวัดที่ไม่มีภาพจึงยังไม่ถูกประเมิน</span></div>';
    if(f.runLevel==='bad')html+='<div class="alert">ข้อมูลเก่ากว่า 12 ชั่วโมง อาจมีรอบประมวลผลที่ไม่สำเร็จ อย่าใช้เป็นสถานการณ์ปัจจุบัน</div>';
    else if(f.runLevel==='warn')html+='<div class="alert">ข้อมูลเก่ากว่า 6 ชั่วโมง รอบประมวลผลล่าสุดอาจล่าช้า</div>';
    return html;
  }

  // ---------- 2. cards ----------
  // Top cards = the 2P2R stages in the current scale: districts per stage (district / tambon scale) or provinces per stage
  // (province scale), within the province / district / search filters. The stage filter itself is not applied to the
  // counts (every card would read 0 but one); the selected stage card is marked instead, and a card toggles that filter.
  // Without the district tab the cards fall back to the tambon status counts.
  function cardsHtml(rows,districts){
    if(!ampRows().length)return tambonCardsHtml(rows,districts);
    const byProv=unitNow()==='prov';
    const amps=M.waterScope(rowsAll(),ampRows(),{province:state.province,districtCode:state.district?.code,query:state.query,provinces:regionProvinces()}).amps;
    const c={};for(const k of LEVELS)c[k]={n:0,provs:new Set(),tambons:0,districts:0};
    if(byProv){
      for(const pr of M.waterProvincesFromAmphoe(amps)){const x=c[pr.level_code];if(!x)continue;x.n++;x.districts+=pr.red_districts+pr.orange_districts+pr.yellow_districts+pr.green_districts;x.tambons+=pr.waterlogged_tambons||0}
    }else for(const r of amps){const x=c[String(r.level_code).trim()];if(!x)continue;x.n++;x.provs.add(r.province_code);x.tambons+=Number.isFinite(r.waterlogged_tambons)?r.waterlogged_tambons:0}
    const unit=byProv?'จังหวัด':'อำเภอ';
    const stageCard=k=>{const l=M.WATER_2P2R[k],x=c[k];
      const note=byProv?'จังหวัด · รวม '+fmt(x.districts)+' อำเภอที่มีระยะ 2P2R':'อำเภอ ใน '+fmt(x.provs.size)+' จังหวัด';
      const extra=k==='green'?' · ประมาณว่าน้ำลด':x.tambons?' · ตำบลน้ำขัง '+fmt(x.tambons):'';
      return '<article class="card water-stage-card" style="--stage:'+l.color+'" data-water-level="'+k+'" role="button" tabindex="0" aria-pressed="'+(state.level===k)+'" title="กดเพื่อกรองระยะนี้ · '+esc(l.label+' · '+l.phase)+'">'
        +'<div class="eyebrow"><i class="swatch" style="background:'+l.color+'"></i>'+esc(l.stage)+'</div><div class="number">'+fmt(x.n)+'</div><div class="card-note">'+note+extra+'</div></article>'};
    return '<div class="cards water-stage-cards" id="waterCards" aria-live="polite" aria-label="จำนวน'+unit+'ตามระยะ 2P2R">'+LEVELS.map(stageCard).join('')+'</div>';
  }
  function tambonCardsHtml(rows,districts){
    const s=M.waterSummary(rows),hasAmp=ampRows().length>0;
    const ddpmDistricts=hasAmp?M.waterDdpmDistricts(districts):M.waterDdpmDistricts(rows);
    const ddpmOnly=hasAmp?M.waterDdpmOnlyCount(districts):null;   // null (no district tab) shows as –, never 0
    return '<div class="cards" id="waterCards" aria-live="polite">'
      +card('น้ำขัง (ตำบล)',s.logged,'ยืนยันด้วยภาพ '+fmt(s.image)+' · ตาม ปภ. '+fmt(s.ddpm)+(s.unknownConf?' · ไม่ระบุ '+fmt(s.unknownConf):''),true)
      +card('เคยพบน้ำ',s.stale,'ไม่มีภาพใหม่ ไม่ใช่น้ำขัง และไม่ได้แปลว่าน้ำลด')
      +card('พบน้ำใหม่',s.fresh,'ตำบล พบน้ำในภาพล่าสุดครั้งแรก')
      +card('เฝ้าระวัง / ข้อมูลไม่พอ',s.watch,'ตำบล'+(s.other?' · สถานะอื่น '+fmt(s.other):''))
      +card('อำเภอน้ำขังตาม ปภ. (ไม่มีภาพ)',ddpmOnly,'อำเภอ ในจังหวัดที่ไม่มีภาพดาวเทียมพบน้ำ ใช้ประกาศ ปภ. ระดับอำเภอ')
      +card('อำเภอที่ ปภ. รายงานต่อเนื่อง ≥ 3 วัน',ddpmDistricts,'อำเภอ'+(hasAmp?'':' (นับจากรายการตำบล)'))
      +'</div>';
  }

  // ---------- 3. filters ----------
  // Same bar as the other tabs: white card, labelled fields, buttons on the right. The status toggles live above the map.
  function provinceOptions(rows){
    const rp=regionProvinces(),inRegion=rp?new Set(rp):null;
    return Array.from(new Set(rows.map(r=>r.province).concat(ampRows().map(r=>r.province)).filter(p=>p&&(!inRegion||inRegion.has(p))))).sort((a,b)=>a.localeCompare(b,'th'));
  }
  const provinceSelectHtml=rows=>'<option value="">ทุกจังหวัด</option>'+provinceOptions(rows).map(p=>'<option'+(p===state.province?' selected':'')+'>'+esc(p)+'</option>').join('');
  function regionOptions(){
    return [...new Set(regionMap().values())].sort((a,b)=>a.localeCompare(b,'th',{numeric:true}));
  }
  // Districts for the district dropdown: every district with a 2P2R row or a tambon, within the chosen province and level.
  function districtOptions(){
    const by=new Map();
    for(const r of ampRows())by.set(r.district_code,{code:r.district_code,name:r.district,province:r.province,level:r.level_code});
    for(const r of rowsAll()){const c=M.waterAmpCode(r.district_code);if(c&&!by.has(c))by.set(c,{code:c,name:r.district,province:r.province,level:null})}
    const rp=regionProvinces(),inRegion=rp?new Set(rp):null;
    return [...by.values()].filter(d=>(!state.province||d.province===state.province)&&(!inRegion||inRegion.has(d.province))&&(!state.level||d.level===state.level))
      .sort((a,b)=>String(a.province).localeCompare(String(b.province),'th')||String(a.name).localeCompare(String(b.name),'th'));
  }
  function districtSelectHtml(){
    const cur=selCode();
    return '<option value="">ทุกอำเภอ</option>'+districtOptions().map(d=>'<option value="'+esc(d.code)+'"'+(d.code===cur?' selected':'')+'>อ.'+esc(d.name)+(state.province?'':' (จ.'+esc(d.province)+')')+'</option>').join('');
  }
  function filtersHtml(rows){
    return '<div class="filters" id="waterFilters" role="search">'
      +'<div class="field"><label for="waterUnit">ระดับข้อมูล</label><select id="waterUnit">'+(ampFill()?'<option value="amp"'+(unitNow()==='amp'?' selected':'')+'>อำเภอ</option>':'')+'<option value="prov"'+(unitNow()==='prov'?' selected':'')+'>จังหวัด</option></select></div>'
      +'<div class="field"><label for="waterRegion">เขตสุขภาพ</label><select id="waterRegion"><option value="">ทุกเขตสุขภาพ</option>'+regionOptions().map(g=>'<option'+(g===state.region?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select></div>'
      +'<div class="field"><label for="waterProvince">จังหวัด</label><select id="waterProvince">'+provinceSelectHtml(rows)+'</select></div>'
      +'<div class="field"><label for="waterDistrict">อำเภอ</label><select id="waterDistrict"'+(unitNow()==='prov'?' disabled title="เลือกระดับข้อมูลเป็นอำเภอเพื่อกรองรายอำเภอ"':'')+'>'+districtSelectHtml()+'</select></div>'
      +'<div class="field"><label for="waterLevel">ระยะ 2P2R</label><select id="waterLevel"><option value="">ทุกระยะ</option>'+LEVELS.map(k=>'<option value="'+k+'"'+(k===state.level?' selected':'')+'>'+esc(stageOf(k))+' ('+esc(M.WATER_2P2R[k].label)+')</option>').join('')+'</select></div>'
      +'<div class="field"><label for="waterQuery">ค้นหา</label><input type="search" id="waterQuery" placeholder="ชื่อตำบล อำเภอ หรือจังหวัด" value="'+esc(state.query)+'"></div>'
      +'<div class="water-filter-actions"><button class="lightbtn" id="waterReset" type="button">ล้างตัวกรอง</button>'
      +'<button class="lightbtn" id="waterRefresh" type="button" title="อ่านข้อมูลสดจากชีตอีกครั้ง">รีเฟรชข้อมูล</button>'
      +'<span class="filter-note" id="waterRefreshStatus" aria-live="polite"></span></div></div>';
  }
  // Status toggles, drawn like the trend cards above the national map (colour dot, label, count) but pressable.
  function statusCardsHtml(rows){
    const counts=new Map();for(const r of rows)counts.set(r.status,(counts.get(r.status)||0)+1);
    // A status with no tambon in the filters is hidden (its toggle would do nothing).
    return STATUSES.filter(st=>counts.get(st)>0).map(st=>'<button type="button" class="trend-card water-status-card" data-water-status="'+esc(st)+'" aria-pressed="'+state.statuses.has(st)+'" title="แสดง/ซ่อน '+esc(label(st))+'"><i class="dot" style="'+dotCss(st)+'"></i><span class="tc-label">'+esc(label(st))+'</span><span class="tc-num">'+fmt(counts.get(st)||0)+'</span></button>').join('');
  }

  // ---------- 4. map ----------
  // Legend of the 2P2R fill: districts per level (the map colours districts), with the province count beside it.
  function provLegendHtml(){
    if(!ampRows().length)return '<p class="mini-note water-prov-none">ยังไม่มีข้อมูลสี 2P2R รอบนี้ (แท็บ flood_waterlogged_amphoe) จุดตำบลยังใช้ได้ตามปกติ</p>';
    // Counts in the current scale: districts by their level, or provinces by the province level (within the filters).
    const amps=scope().amps,n={red:0,orange:0,yellow:0,green:0},byProv=unitNow()==='prov';
    if(byProv){for(const r of M.waterProvincesFromAmphoe(amps))if(n[r.level_code]!=null)n[r.level_code]++}
    else for(const r of amps)n[String(r.level_code).trim()]++;
    const unitName=byProv?'จังหวัด':'อำเภอ';
    // Stage name only (ตอบโต้ทันที / ตรวจเชิงรุก / ...); colour, 2P2R phase and counts (within the filters) are in the tooltip.
    // A stage is also a button: it sets / clears the level filter like the "ระยะ 2P2R" dropdown.
    const item=k=>{const l=M.WATER_2P2R[k];return '<button type="button" class="water-prov-key water-level-key" data-water-level="'+k+'" aria-pressed="'+(state.level===k)+'" title="'+esc(l.label+' · '+l.phase)+' · '+fmt(n[k])+' '+unitName+' · กดเพื่อกรองระยะนี้"><i class="swatch" style="background:'+l.color+'"></i>'+esc(l.stage)+'</button>'};
    return '<div class="map-legend water-prov-legend" aria-label="สี 2P2R">'+['red','orange','yellow','green'].map(item).join('')
      +'<span class="water-prov-key"><i class="swatch swatch-none"></i>'+esc(M.WATER_2P2R.normal.stage)+'</span></div>';
  }
  function mapPanel(rows){
    const legend=STATUSES.map(st=>'<span><i class="dot" style="'+dotCss(st)+'"></i>'+esc(label(st))+'</span>').join('')
      +'<span><i class="dot dot-dashed" style="background:'+meta('น้ำขัง').color+'"></i>ขอบประ = ตาม ปภ.</span>';
    return '<section class="panel" id="waterMapPanel"><div class="panel-head"><div><h2>แผนที่น้ำขัง</h2></div><span class="badge" id="waterMapCount">'+fmt(rows.length)+' ตำบล</span></div>'
      +'<div class="trend-cards water-status-cards" id="waterStatusCards" role="group" aria-label="กรองตามสถานะ">'+statusCardsHtml(rows)+'</div>'
      +'<div id="waterMap" class="map water-map" role="img" aria-label="แผนที่ตำบลที่พบน้ำ สีตามสถานะ และสีอำเภอตามระดับ 2P2R"></div>'
      +'<div class="map-legend">'+legend+'</div><div id="waterProvLegend">'+provLegendHtml()+'</div>'
      +'<div class="map-source">ที่มา : GISTDA (ภาพดาวเทียม), กรมป้องกันและบรรเทาสาธารณภัย (ปภ.) · ขอบเขตอำเภอ: OpenGISData-Thailand (ย่อขนาด)</div></section>';
  }
  // Layer toggle goes into the shared map footer (expand button + layers popover) like the other maps.
  function layerTools(){
    const chip=(id,on,icon,text)=>'<label class="layer-chip"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span class="chip-icon '+icon+'" aria-hidden="true"></span><span class="chip-text">'+text+'</span><span class="chip-check" aria-hidden="true">✓</span></label>';
    // One 2P2R fill: districts or provinces by the "ระดับข้อมูล" filter, never both at once.
    const html=(provRows().length?chip('waterProvLayer',state.showProv,'ic-p2r','สี 2P2R'):'')
      +(window.HEALTH_REGIONS_GEOJSON?chip('waterRegionLayer',state.showRegion,'ic-region-thick','เส้นเขตสุขภาพ'):'')
      +(window.PROVINCES_GEOJSON?chip('waterProvLineLayer',state.showProvLine,'ic-province','เส้นจังหวัด'):'')
      +(window.PROVINCES_GEOJSON?chip('waterProvNameLayer',state.showProvName,'ic-label','ชื่อจังหวัด'):'')
      +(window.AMPHOE_GEOJSON?chip('waterAmpLayer',state.showAmp,'ic-amphoe','เส้นอำเภอ'):'')

  // Name with its stage colour box (the stage name is in the title), for the 2P2R side lists.
  const stageName=(r,html)=>{const lv=M.water2p2rLevel(r);return '<span class="water-stage-name"'+(lv?' title="'+esc(lv.stage)+'"':'')+'><i class="swatch" style="background:'+(lv?.color||'#e2e8f0')+'"></i>'+html+'</span>'};
  // District-scale 2P2R table: the districts within the filters, highest stage first. The table goes through
  // DashboardTables (host #waterSideList) for the "ตัวกรอง" button and paging (13 rows a page, about the map height beside it).
  function districtListHtml(){
    const rows=scopeAmps();
    const body=rows.map(r=>'<tr><td>'+stageName(r,'<button type="button" class="water-link" data-water-district="'+esc(r.district_code)+'">'+esc(r.district)+'</button>')+'</td><td>'+esc(r.province)+'</td>'
      +'<td class="num">'+num(r.total_tambons)+'</td><td class="num">'+num(r.ddpm_days)+'</td></tr>').join('');
    return '<div class="panel-head"><div><h2>อำเภอตามระยะ 2P2R</h2></div></div>'
      +'<div class="panel-body water-side-body"><div class="table-wrap water-side-list" id="waterSideList"><table><thead><tr><th>อำเภอ</th><th>จังหวัด</th><th class="num">พบน้ำ (ตำบล)</th><th class="num">อุทกภัย (วัน)</th></tr></thead><tbody>'
      +(body||'<tr><td colspan="4" class="empty">ไม่มีอำเภอตามตัวกรอง</td></tr>')+'</tbody></table></div></div>';
  }
  // Province-scale 2P2R table: provinces by their own level (the highest district level); district counts within the filters.
  function provinceListHtml(){
    const rows=M.waterProvinceRows(M.waterProvincesFromAmphoe(scope().amps)).filter(r=>M.water2p2rLevel(r).rank>0);
    const body=rows.map(r=>{
      return '<tr><td>'+stageName(r,'<button type="button" class="water-link" data-water-prov="'+esc(M.waterProvCode(r.province_code))+'">'+esc(r.province)+'</button>')+'</td>'
        +'<td class="num">'+num(r.total_tambons)+'</td><td class="num">'+num(r.red_districts)+'</td><td class="num">'+num(r.orange_districts)+'</td><td class="num">'+num(r.green_districts)+'</td></tr>'}).join('');
    return '<div class="panel-head"><div><h2>จังหวัดตามระยะ 2P2R</h2></div></div>'
      +'<div class="panel-body water-side-body"><div class="table-wrap water-side-list" id="waterSideList"><table><thead><tr><th>จังหวัด</th><th class="num">พบน้ำ (ตำบล)</th><th class="num">ตอบโต้ทันที</th><th class="num">เชิงรุก</th><th class="num">ฟื้นฟู</th></tr></thead><tbody>'
      +(body||'<tr><td colspan="5" class="empty">ไม่มีจังหวัดที่มีสถานการณ์</td></tr>')+'</tbody></table></div></div>';
  }
  function setDetail(){
    const d=$('waterDetail');if(!d)return null;
    d.innerHTML=detailHtml();
    if(window.DashboardTables)window.DashboardTables.paginate();
    requestAnimationFrame(fitSideList);
    return d;
  }
  // The 2P2R list sits beside the map: as many rows per page as fill the map panel's height (which depends on the screen
  // width), so neither panel is left with empty space. Stacked (one column) it keeps the default 13.
  const SIDE_DEFAULT=13;
  function fitSideList(){
    const T=window.DashboardTables,det=$('waterDetail'),mp=$('waterMapPanel'),pager=det&&det.querySelector('[data-pager="waterSideList"]');
    if(!T||!T.setPageSize||!det||!mp||!pager)return;
    if(matchMedia('(max-width:1023px)').matches){if(T.pageSize('waterSideList')!==SIDE_DEFAULT){T.setPageSize('waterSideList',SIDE_DEFAULT);T.paginate()}return}
    const row=det.querySelector('#waterSideList tbody tr:not([hidden])');if(!row)return;
    const rowH=row.getBoundingClientRect().height;if(!(rowH>0))return;
    const pad=parseFloat(getComputedStyle(det).paddingBottom)||0;
    const natural=el=>{const last=el.lastElementChild;return last?last.getBoundingClientRect().bottom-el.getBoundingClientRect().top:0};
    const diff=natural(mp)-(pager.getBoundingClientRect().bottom-det.getBoundingClientRect().top)-pad;
    const cur=T.pageSize('waterSideList')||SIDE_DEFAULT,delta=diff>=0?Math.floor(diff/rowH):-Math.ceil(-diff/rowH);
    const next=Math.max(5,Math.min(40,cur+delta));
    if(next!==cur){T.setPageSize('waterSideList',next);T.paginate()}
  }
  let fitTimer=null;
  window.addEventListener('resize',()=>{if(!isOpen)return;clearTimeout(fitTimer);fitTimer=setTimeout(fitSideList,150)});
  function detailHtml(){
    const r=state.sel&&rowsAll().find(x=>key(x)===state.sel);
    const prov=districtDetailHtml()+provinceDetailHtml();
    if(!r&&prov)return prov;
    if(!r&&ampRows().length)return unitNow()==='prov'?provinceListHtml():districtListHtml();
    if(!r)return '<div class="panel-head"><div><h2>รายละเอียดตำบล</h2><p class="sub">กดจุดบนแผนที่ หรือชื่อตำบลในตารางเพื่อดูรายละเอียด กดอำเภอบนแผนที่เพื่อดูระดับ 2P2R</p></div></div><div class="panel-body"><p class="empty">ยังไม่ได้เลือกตำบลหรือจังหวัด</p></div>';
    return prov+tambonDetailHtml(r);
  }
  function tambonDetailHtml(r){
    const reasons=M.reasonList(r.reasons).map(x=>'<li>'+esc(x)+'</li>').join('');
    const stat=(k,v,sub)=>'<div class="stat"><div class="stat-k">'+k+'</div><div class="stat-v">'+v+'</div>'+(sub?'<div class="stat-s">'+sub+'</div>':'')+'</div>';
    const span=Number.isFinite(r.run_span_days)?fmt(r.run_span_days,1)+' วัน':'-';
    const range=r.run_start||r.run_end?day(r.run_start)+' – '+day(r.run_end):'';
    const ddpm=r.in_ddpm==null?'-':esc(r.in_ddpm);
    return '<div class="panel-head"><div><h2>ต.'+esc(r.subdistrict||'-')+'</h2><p class="sub">อ.'+esc(r.district||'-')+' · จ.'+esc(r.province)+'</p></div><div>'+statusCell(r)+'</div></div>'
      +'<div class="panel-body">'
      +(r.confidence?'<p class="mini-note">ความมั่นใจ: '+esc(r.confidence)+(M.waterConfidence(r)?' · '+esc(M.waterConfidence(r).label):'')+'</p>':'')
      +'<div class="stat-grid">'
        +stat('พบน้ำต่อเนื่อง',span,esc(range))
        +stat('อายุภาพที่พบน้ำล่าสุด',hoursText(r.image_age_hours),'ณ รอบประมวลผล '+when(r.run_at))
        +stat('พื้นที่น้ำในภาพล่าสุด',Number.isFinite(r.latest_area_km2)?fmt(r.latest_area_km2,2)+' ตร.กม.':'-',Number.isFinite(r.detections)?'พบน้ำ '+fmt(r.detections)+' ครั้ง':'')
        +stat('รายงาน ปภ. (ระดับอำเภอ)',Number.isFinite(r.ddpm_days)?fmt(r.ddpm_days)+' วันติดต่อกัน':ddpm,Number.isFinite(r.ddpm_days)?'อำเภอที่ ปภ. รายงาน: '+ddpm+(r.ddpm_report_date?' · รายงานล่าสุด '+day(r.ddpm_report_date):''):(r.ddpm_report_date?'รายงานล่าสุด '+day(r.ddpm_report_date):''))
      +'</div>'
      +'<h3 class="risk-h">เหตุผลที่ประเมิน</h3>'+(reasons?'<ul class="reason-chips">'+reasons+'</ul>':'<p class="empty">ไม่มีข้อความเหตุผล</p>')
      +'</div>';
  }

  // ---------- 6. tables ----------
  function tambonTable(rows){
    const T=window.DashboardTables;
    // Like the 2P2R list: the status is the coloured dot on the name (its label in the title). Run length, image age,
    // evidence and reasons stay in the tambon detail panel and the CSV.
    const name=r=>'<span class="water-stage-name" title="'+esc(label(r.status))+'"><i class="dot" style="'+dotCss(r.status)+'"></i><button type="button" class="water-link" data-water-sel="'+esc(key(r))+'">'+esc(r.subdistrict||'-')+'</button></span>';
    const body=rows.map(r=>[name(r),esc(r.district||'-'),esc(r.province),
      esc(r.run_start||r.run_end?day(r.run_start)+' – '+day(r.run_end):'-'),num(r.latest_area_km2,2),
      num(r.ddpm_days)]);
    return T.table(['ตำบล','อำเภอ','จังหวัด','ช่วงที่พบน้ำ','พื้นที่น้ำ (ตร.กม.)','อุทกภัย (วัน)'],body);
  }
  const ddpmOnlyBadge='<span class="badge water-badge water-ddpm" title="จังหวัดนี้ไม่มีภาพดาวเทียมพบน้ำ แต่ ปภ. รายงานอำเภอต่อเนื่อง ≥ 3 วัน">น้ำขังตามประกาศ ปภ. — ไม่มีภาพดาวเทียม</span>';
  const basisOf=r=>M.waterIsDdpmLogged(r)?ddpmOnlyBadge:esc(r.basis||'–');
  function districtTable(rows){
    const T=window.DashboardTables;
    // Empty (null) count / area cells of DDPM-only rows show "–", never 0.
    const body=rows.map(r=>[stageName(r,'<button type="button" class="water-link" data-water-district="'+esc(r.district_code||'')+'">'+esc(r.district)+'</button>'),esc(r.province),
      num(r.waterlogged_tambons),num(r.total_tambons),num(r.latest_area_km2,2),num(r.ddpm_days),basisOf(r)]);
    return T.table(['อำเภอ','จังหวัด','น้ำขัง (ตำบล)','พบน้ำ (ตำบล)','พื้นที่น้ำล่าสุด (ตร.กม.)','อุทกภัย (วัน)','ที่มา'],body);
  }
  const districtRows=()=>scopeAmps();
  function districtNoteHtml(){
    const n=state.note;if(!n)return '';
    return '<div class="alert water-ddpm-note" role="status"><b>อ.'+esc(n.name)+' (จ.'+esc(n.province)+')</b> ไม่มีรายการตำบล: ระดับของอำเภอนี้มาจากรายงาน ปภ. ซึ่งระบุสถานการณ์ระดับอำเภอ ไม่ระบุตำบล'+(n.reasons?' · '+esc(n.reasons):'')+'</div>';
  }
  // The district table is redrawn alone on a filter change (the page and the map stay).
  function renderDistrictTable(){
    const host=$('waterDistrictTable');if(!host)return;
    host.innerHTML=districtTable(districtRows());
    const note=$('waterDistrictNote');if(note)note.innerHTML=districtNoteHtml();
    window.DashboardTables.paginate();window.DashboardTables.hints();
  }
  function districtPanel(districts){
    const st=status('flood_waterlogged_amphoe');
    const inner=!st||st.status==='error'?'<div class="panel-body"><div class="alert">ยังไม่มีข้อมูลสรุปรายอำเภอรอบนี้ (แท็บ flood_waterlogged_amphoe) รายการตำบลด้านบนยังใช้งานได้</div></div>'
      :!ampRows().length?'<div class="panel-body"><div class="alert">ยังไม่มีข้อมูลสรุปรายอำเภอรอบนี้</div></div>'
      :'<div id="waterDistrictNote" aria-live="polite">'+districtNoteHtml()+'</div><div class="table-wrap" id="waterDistrictTable">'+districtTable(districtRows())+'</div>';
    return '<section class="panel water-table-panel"><div class="panel-head"><div><h2>สรุปรายอำเภอ</h2></div></div>'+inner+'</section>';
  }

  // One-box summary like the national "situation" panel, with a copy button.
  function dateTh(iso){const t=M.timestamp(iso);return Number.isFinite(t)?new Date(t).toLocaleDateString('th-TH',{...tz,day:'numeric',month:'short',year:'numeric'}):'–'}
  function scopeText(){
    const parts=[];
    if(state.region&&!state.province)parts.push(state.region);
    if(state.province)parts.push('จ.'+state.province);
    if(state.district)parts.push('อ.'+state.district.name);
    if(state.level)parts.push('ระดับ'+stageOf(state.level));
    if(state.query.trim())parts.push('ค้นหา "'+state.query.trim()+'"');
    return parts.join(' · ');
  }
  function situationLines(rows,districts){
    const s=M.waterSummary(rows),pv=M.waterProvinceSummary(M.waterProvincesFromAmphoe(districts)),ddpmOnly=ampRows().length?M.waterDdpmOnlyCount(districts):null;
    const loggedProv=new Set(rows.filter(M.waterIsLogged).map(r=>r.province)).size;
    const lines=['ตำบลน้ำขัง '+fmt(s.logged)+' ตำบล ใน '+fmt(loggedProv)+' จังหวัด (ยืนยันด้วยภาพ '+fmt(s.image)+' · ตาม ปภ. '+fmt(s.ddpm)+')',
      'พบน้ำใหม่ '+fmt(s.fresh)+' ตำบล · เคยพบน้ำ '+fmt(s.stale)+' ตำบล · เฝ้าระวัง/ข้อมูลไม่พอ '+fmt(s.watch)+' ตำบล'];
    if(ddpmOnly!=null)lines.push('อำเภอน้ำขังตามประกาศ ปภ. ที่ไม่มีภาพดาวเทียม '+fmt(ddpmOnly)+' อำเภอ');
    if(ampRows().length){const n={red:0,orange:0,yellow:0,green:0};for(const r of districts)n[String(r.level_code).trim()]++;
      lines.push('อำเภอตามระดับ 2P2R: '+LEVELS.map(k=>stageOf(k)+' '+fmt(n[k])).join(' · ')+' อำเภอ')}
    if(pv.total&&!state.level)lines.push('จังหวัดตามระดับ 2P2R (ระดับสูงสุดของอำเภอ): '+LEVELS.map(k=>stageOf(k)+' '+fmt(pv[k])).join(' · ')+' จังหวัด');
    const sc=scopeText();if(sc)lines.unshift('ตามตัวกรอง: '+sc);
    return lines;
  }
  function situationHtml(rows,districts){
    const f=M.waterFreshness(rows,Date.now()),lines=situationLines(rows,districts);
    return '<section class="panel situation" id="waterSituation" aria-label="สรุปสถานการณ์น้ำขัง"><div class="situation-head"><h2>'+dateTh(f.runAt)+' สรุปสถานการณ์น้ำขัง</h2><button type="button" class="lightbtn" data-water-copy>คัดลอกข้อความ</button></div>'
      +'<ul>'+lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>'
      +'</section>';
  }
  async function copySituation(button){
    const f=M.waterFreshness(rowsAll(),Date.now()),rows=scope().tambons;
    const districts=scopeAmps();
    const text=dateTh(f.runAt)+' สรุปสถานการณ์น้ำขัง\n'+situationLines(rows,districts).map(l=>'- '+l).join('\n')+'\n(ไม่ใช่ประกาศทางการ · สีแดง = น้ำขังนาน เสี่ยงน้ำเน่าเสีย ไม่ใช่การยืนยันคุณภาพน้ำ · สีเขียว = ประมาณว่าน้ำลด ไม่ใช่การยืนยัน)';
    let done=false;
    try{await navigator.clipboard.writeText(text);done=true}catch(e){
      try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();done=document.execCommand('copy');ta.remove()}catch(_){}
    }
    const old=button.textContent;button.textContent=done?'คัดลอกแล้ว':'คัดลอกไม่สำเร็จ';setTimeout(()=>{button.textContent=old},1800);
  }

  // ---------- render ----------
  function render(){
    destroyMap();
    const d=data();
    if(!d){pane.innerHTML='<p class="empty">กำลังโหลดข้อมูล…</p>';return}
    const runAt=M.waterFreshness(rowsAll(),Date.now()).runAt;
    const head='<div class="heading"><div><h1>น้ำขัง</h1></div>'+(runAt?'<div class="report-date">รอบข้อมูล '+when(runAt)+'</div>':'')+'</div>';
    const st=status('flood_waterlogged'),all=rowsAll();
    if(!st||st.status==='error'||!all.length){
      pane.innerHTML=head+notice('ยังไม่มีข้อมูลรอบนี้ (ข้อมูล flood_waterlogged ไม่พบ ว่าง หรือรูปแบบไม่ตรง) แท็บอื่นของแดชบอร์ดยังใช้งานได้ตามปกติ',true);
      bind();return;
    }
    // A selection or filter left over from an earlier load may point at rows that are gone.
    if(state.sel&&!all.some(r=>key(r)===state.sel))state.sel=null;
    const known=new Set(all.map(r=>r.province).concat(ampRows().map(r=>r.province)));
    if(state.province&&!known.has(state.province))setProvince('');
    else state.provSel=provByName(state.province)?M.waterProvCode(provByName(state.province).province_code):null;
    if(state.district&&!ampIndex().has(state.district.code)&&!all.some(r=>M.waterAmpCode(r.district_code)===state.district.code)){state.district=null;state.note=null}
    if(state.level&&!M.WATER_2P2R[state.level])state.level='';
    const sc=scope(),districts=M.waterDistricts(sc.amps);
    pane.innerHTML=head+freshnessHtml(all)+filtersHtml(all)+cardsHtml(sc.tambons,districts)
      +'<div class="grid water-grid">'+mapPanel(sc.tambons)+'<section class="panel" id="waterDetail" aria-live="polite">'+detailHtml()+'</section></div>'
      +situationHtml(sc.tambons,districts)
      +'<section class="panel water-table-panel"><div class="panel-head"><div><h2>รายการตำบลที่พบน้ำ</h2></div><button type="button" class="lightbtn" data-water-csv>ดาวน์โหลด CSV</button></div>'
      +'<div class="table-wrap" id="waterTable"></div></section>'
      +districtPanel(districts);
    bind();
    drawMap();
    requestAnimationFrame(()=>requestAnimationFrame(fitSideList));
    renderTable();
    if(window.DashboardTables&&$('waterDistrictTable'))window.DashboardTables.paginate();
  }
  // Filters change the table, the points and the counts only; the page and the map instance stay.
  function renderTable(){
    const host=$('waterTable');if(!host)return;
    const rows=visibleRows(),T=window.DashboardTables;
    host.innerHTML=tambonTable(rows);
    T.paginate();T.hints();
    markSelectedRow();
  }
  function markSelectedRow(){
    pane.querySelectorAll('#waterTable tbody tr').forEach(tr=>tr.classList.toggle('sel',!!state.sel&&tr.querySelector('[data-water-sel]')?.dataset.waterSel===state.sel));
  }
  // Any filter change redraws every section from the same scope; the page and the map instance stay.
  function applyFilters(refit=true){
    const sc=scope(),districts=M.waterDistricts(sc.amps);
    const rg=$('waterRegion');if(rg&&rg.value!==state.region)rg.value=state.region;
    const sel=$('waterProvince');if(sel){sel.innerHTML=provinceSelectHtml(rowsAll());sel.value=state.province}
    const un=$('waterUnit');if(un&&un.value!==unitNow())un.value=unitNow();
    const ds=$('waterDistrict');if(ds){ds.innerHTML=districtSelectHtml();ds.disabled=unitNow()==='prov'}
    const lv=$('waterLevel');if(lv&&lv.value!==state.level)lv.value=state.level;
    const cards=$('waterCards');if(cards)cards.outerHTML=cardsHtml(sc.tambons,districts);
    const stc=$('waterStatusCards');if(stc)stc.innerHTML=statusCardsHtml(sc.tambons);
    const lg=$('waterProvLegend');if(lg)lg.innerHTML=provLegendHtml();
    const si=$('waterSituation');if(si)si.outerHTML=situationHtml(sc.tambons,districts);
    renderTable();restyleAmphoes();drawPoints(refit);syncTambons();restyleTambons();renderDistrictTable();
    const detail=setDetail();
  }
  // The province filter (dropdown, map click, reset) also decides which province is highlighted and shown in the detail panel.
  function setProvince(name){
    state.province=name||'';
    if(state.province&&state.region&&regionMap().get(state.province)!==state.region)state.region=regionMap().get(state.province)||'';
    if(state.district&&state.province&&state.district.province!==state.province){state.district=null;state.note=null}
    const row=state.province?provByName(state.province):null;
    state.provSel=row?M.waterProvCode(row.province_code):null;
  }
  function chooseProvince(code){
    const row=provIndex().get(code);if(!row)return;
    setProvince(state.provSel===code?'':row.province);   // clicking the selected province again clears the filter
    applyFilters(true);
    const detail=$('waterDetail');
    if(detail&&state.provSel&&matchMedia('(max-width:900px)').matches)detail.scrollIntoView({behavior:'smooth',block:'start'});
  }

  // Province scale has no district filter (the province list and fill are per province); a district chosen anywhere
  // switches back to district scale.
  function setUnit(u){
    state.unit=u==='prov'?'prov':'amp';
    if(unitNow()==='prov'&&state.district){state.district=null;state.note=null}
  }
  // A district (map polygon or district table): outline it, filter to its province, show its level in the detail panel and,
  // when it has tambons, filter the tambon list to it. A district without tambons (DDPM-based) says so instead of an empty list.
  // Clicking the selected district on the map again clears it.
  function setDistrict(code){
    const c=M.waterAmpCode(code);
    if(!c){state.district=null;state.note=null;return false}
    const r=ampIndex().get(c)||null,t=rowsAll().find(x=>M.waterAmpCode(x.district_code)===c);
    if(!r&&!t)return false;
    const name=r?r.district:t.district,province=r?r.province:t.province;
    state.district={code:c,name,province};setProvince(province);state.unit='amp';
    if(state.level&&(!r||r.level_code!==state.level))state.level='';   // the district's own level wins over a level filter that excludes it
    state.note=t?null:{name,province,reasons:r&&r.reasons};
    return !!t;
  }
  function chooseDistrict(code,fromTable){
    const c=M.waterAmpCode(code);
    if(!fromTable&&state.district&&state.district.code===c){setDistrict('');applyFilters(false);return}
    const hasTambons=setDistrict(c);if(!state.district)return;
    applyFilters(true);
    const target=fromTable?(hasTambons?$('waterTable'):$('waterDistrictNote')):$('waterDetail');
    if(target&&(fromTable||matchMedia('(max-width:900px)').matches))target.scrollIntoView({behavior:'smooth',block:'start'});
  }

  // Selecting a tambon patches the detail card, the two markers and the table row (no full redraw: scroll and map stay).
  function choose(k,fromTable){
    const r=rowsAll().find(x=>key(x)===k);if(!r)return;
    const prev=state.sel;state.sel=k;
    const detail=setDetail();
    const was=prev&&markers.get(prev),now=markers.get(k);
    if(was)was.setStyle(pointStyle(rowsAll().find(x=>key(x)===prev)||r,false));
    if(now){now.setStyle(pointStyle(r,true));now.bringToFront();if(fromTable&&map)map.panTo(now.getLatLng(),{animate:false})}
    restyleTambons();
    if(!now&&fromTable&&map){for(const layer of tambonLayers.values())layer.eachLayer(l=>{if(String(l.feature.properties.tam_code)===String(r.tb_idn))map.panTo(l.getBounds().getCenter(),{animate:false})})}
    markSelectedRow();
    if(detail&&matchMedia('(max-width:900px)').matches)detail.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function csv(rows){
    const cols=[['status','สถานะ'],['confidence','ความมั่นใจ'],['province','จังหวัด'],['district','อำเภอ'],['subdistrict','ตำบล'],['tb_idn','รหัสตำบล'],['run_span_days','พบน้ำต่อเนื่อง (วัน)'],['run_start','เริ่มพบน้ำ'],['run_end','พบน้ำล่าสุด'],['image_age_hours','อายุภาพ (ชม.)'],['detections','จำนวนครั้งที่พบน้ำ'],['latest_area_km2','พื้นที่น้ำล่าสุด (ตร.กม.)'],['in_ddpm','อยู่ในรายงาน ปภ.'],['ddpm_days','ปภ. รายงานต่อเนื่อง (วัน)'],['ddpm_report_date','วันรายงาน ปภ. ล่าสุด'],['latitude','ละติจูด'],['longitude','ลองจิจูด'],['reasons','เหตุผล'],['run_at','รอบข้อมูล']];
    const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
    return '﻿'+[cols.map(c=>cell(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>cell(c[0]==='status'?label(r.status):r[c[0]])).join(','))).join('\r\n');
  }
  // Rows the table currently shows: my filters, then the table's own column filter / search (its row indices refer to the rendered order).
  function exportRows(){
    const rows=visibleRows(),idx=window.DashboardTables?.visibleIndices('waterTable');
    return idx?idx.map(i=>rows[i]).filter(Boolean):rows;
  }

  // Re-reads the three waterlogging tabs (live from the sheet; a tab that fails keeps its previous rows).
  async function readSources(){
    if(typeof requestData!=='function')throw new Error('requestData unavailable');
    for(const [name,k] of Object.entries(M.WATERLOGGED_SOURCES)){
      const next=await requestData(name,true);
      if(next.sourceStatus?.[name]){data().sourceStatus[name]=next.sourceStatus[name];if(next.sourceStatus[name].status==='ok')data()[k]=next[k]}
    }
  }
  async function retry(button){
    button.disabled=true;button.textContent='กำลังอ่าน…';
    try{await readSources()}catch(e){console.warn('waterlogged retry failed',e)}
    render();
  }
  async function refresh(button){
    const out=$('waterRefreshStatus');button.disabled=true;if(out)out.textContent='กำลังอ่านข้อมูล…';
    let ok=true;
    try{await readSources()}catch(e){ok=false;console.warn('waterlogged refresh failed',e)}
    render();
    const o2=$('waterRefreshStatus');if(o2)o2.textContent=ok?'อ่านข้อมูลเมื่อ '+when(new Date().toISOString()):'รีเฟรชไม่สำเร็จ ยังแสดงข้อมูลเดิม';
  }

  function bind(){
    const prov=$('waterProvince');if(prov)prov.addEventListener('change',()=>{setProvince(prov.value);applyFilters()});
    const q=$('waterQuery');if(q)q.addEventListener('input',()=>{state.query=q.value;applyFilters()});
    const unit=$('waterUnit');if(unit)unit.addEventListener('change',()=>{setUnit(unit.value);applyFilters()});
    const dist=$('waterDistrict');if(dist)dist.addEventListener('change',()=>{setDistrict(dist.value);applyFilters()});
    const lvl=$('waterLevel');if(lvl)lvl.addEventListener('change',()=>{setLevel(lvl.value);applyFilters()});
    const region=$('waterRegion');if(region)region.addEventListener('change',()=>{state.region=region.value;if(state.province&&regionMap().get(state.province)!==state.region&&state.region){setProvince('');state.district=null;state.note=null}applyFilters()});
    const reset=$('waterReset');if(reset)reset.addEventListener('click',()=>{state.statuses=new Set(STATUSES);state.district=null;state.note=null;state.region='';setProvince('');if($('waterRegion'))$('waterRegion').value='';state.level='';state.query='';$('waterProvince').value='';$('waterQuery').value='';applyFilters()});
  }
  // A level filter that excludes the chosen district clears the district.
  function setLevel(k){
    state.level=M.WATER_2P2R[k]&&k!=='normal'?k:'';
    if(state.level&&state.district){const r=ampIndex().get(state.district.code);if(!r||r.level_code!==state.level){state.district=null;state.note=null}}
  }
  // One delegated listener: pane.innerHTML is rebuilt on every full render, but the pane element itself stays.
  function onClick(e){
    const retryBtn=e.target.closest('[data-water-retry]');if(retryBtn){retry(retryBtn);return}
    const pb=e.target.closest('[data-water-prov]');if(pb){chooseProvince(pb.dataset.waterProv);return}
    const rf=e.target.closest('#waterRefresh');if(rf){refresh(rf);return}
    const cp=e.target.closest('[data-water-copy]');if(cp){copySituation(cp);return}
    if(e.target.closest('[data-water-clear-province]')){setProvince('');applyFilters();return}
    if(e.target.id==='waterProvLayer'){state.showProv=e.target.checked;restyleAmphoes();return}
    if(e.target.id==='waterAmpLayer'){state.showAmp=e.target.checked;restyleAmphoes();return}
    if(e.target.id==='waterRegionLayer'){state.showRegion=e.target.checked;if(regionLayer)regionLayer.setStyle(regionStyle);return}
    if(e.target.id==='waterProvLineLayer'){state.showProvLine=e.target.checked;if(provLayer)provLayer.setStyle(provStyle);return}
    if(e.target.id==='waterProvNameLayer'){state.showProvName=e.target.checked;showNames();return}
    if(e.target.id==='waterTambonLayer'){state.showTambon=e.target.checked;syncTambons();restyleTambons();drawPoints(false);return}
    if(e.target.closest('[data-water-clear-district]')){setDistrict('');applyFilters();return}
    const lk=e.target.closest('[data-water-level]');if(lk){setLevel(state.level===lk.dataset.waterLevel?'':lk.dataset.waterLevel);applyFilters();return}
    const st=e.target.closest('[data-water-status]');
    if(st){const v=st.dataset.waterStatus;if(state.statuses.has(v))state.statuses.delete(v);else state.statuses.add(v);applyFilters();return}
    const sel=e.target.closest('[data-water-sel]');if(sel){choose(sel.dataset.waterSel,true);return}
    const dist=e.target.closest('[data-water-district]');
    if(dist){chooseDistrict(dist.dataset.waterDistrict,true);return}
    if(e.target.closest('[data-water-csv]')){
      const u=URL.createObjectURL(new Blob([csv(exportRows())],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a');a.href=u;a.download='waterlogged-tambons.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
    }
  }

  pane.addEventListener('click',onClick);
  pane.addEventListener('keydown',e=>{const k=e.target.closest&&e.target.closest('.water-stage-card[data-water-level]');if(k&&(e.key==='Enter'||e.key===' ')){e.preventDefault();k.click()}});
  tab.addEventListener('click',open);
  document.querySelectorAll('.tab').forEach(x=>{if(x!==tab)x.addEventListener('click',close)});
  // dashboard.js re-selects its own tab when it reloads data; the event comes after that, so this tab takes the highlight back.
  window.addEventListener('dashboard:data',()=>{if(isOpen){select(tab);render()}});
})();

</script>
