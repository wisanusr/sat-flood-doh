<script>
/* "น้ำขัง" tab: tambons where the waterlogging pipeline found standing water, with the district summary.
   Reads the flood_waterlogged and flood_waterlogged_district sheet tabs (one row per tambon / per district) through
   window.dashboardData (published by dashboard.js) and redraws on the 'dashboard:data' event. Table paging, column filters
   and the table markup come from window.DashboardTables (dashboard.js), so this tab looks like the others.
   Both tabs are optional: when they cannot be read this tab says so and the rest of the dashboard is unaffected.
   Statuses, confidence and reasons are the pipeline's own; nothing here recomputes them. Not an official announcement. */
(function(){
  const M=window.DashboardModel;
  const tab=document.getElementById('tab-water'),pane=document.getElementById('waterPane');
  if(!M||!tab||!pane)return;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('th-TH',{maximumFractionDigits:d}):'–';
  const tz={timeZone:'Asia/Bangkok'};
  const when=iso=>{const t=M.timestamp(iso);return Number.isFinite(t)?new Date(t).toLocaleString('th-TH',{...tz,day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' น.':'-'};
  const day=iso=>{const t=M.timestamp(iso);return Number.isFinite(t)?new Date(t).toLocaleDateString('th-TH',{...tz,day:'numeric',month:'short'}):'-'};
  const hoursText=h=>!Number.isFinite(h)?'–':h<1?'ไม่ถึง 1 ชม.':fmt(Math.floor(h))+' ชม.';
  const STATUSES=Object.keys(M.WATER_LOG_STATUS);
  const state={statuses:new Set(STATUSES),province:'',district:null,query:'',sel:null,basis:'',note:null,provSel:null,showProv:true,showAmp:true};
  let map=null,ro=null,markers=new Map(),markerLayer=null,isOpen=false;

  const data=()=>window.dashboardData;
  const status=name=>data()?.sourceStatus?.[name];
  const key=r=>r.tb_idn||[r.province,r.district,r.subdistrict].join('|');
  const meta=s=>M.WATER_LOG_STATUS[String(s??'').trim()]||{color:'#94a3b8',short:String(s??'')};
  const rowsAll=()=>M.waterRows(data()?.floodWaterlogged);
  // 2P2R province colours: rows are the pipeline's (level_code decides the colour); unavailable when the tab is missing / empty / unreadable.
  const provRows=()=>status('flood_2p2r_province')?.status==='ok'?M.waterProvinceRows(data()?.flood2p2r):[];
  const provIndex=()=>M.waterProvinceIndex(provRows());
  const provByName=name=>provRows().find(r=>r.province===name);
  const visibleRows=()=>M.waterFilter(rowsAll(),{statuses:state.statuses,province:state.province,districtCode:state.district?.code,query:state.query});

  function select(active){
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===active)));
    $('workspace').setAttribute('aria-labelledby',active.id);
  }
  function open(){isOpen=true;document.body.classList.add('water-mode');select(tab);if(tab.scrollIntoView)tab.scrollIntoView({block:'nearest',inline:'nearest'});render()}
  function close(e){isOpen=false;document.body.classList.remove('water-mode');if(e&&e.currentTarget)select(e.currentTarget)}

  const notice=(text,withRetry)=>'<section class="panel"><div class="panel-body"><div class="alert">'+text+'</div>'+(withRetry?'<p><button class="lightbtn" data-water-retry>ลองอ่านใหม่</button></p>':'')+'</div></section>';
  const card=(label,value,note,accent)=>'<article class="card '+(accent?'accent':'')+'"><div class="eyebrow">'+label+'</div><div class="number">'+fmt(value)+'</div><div class="card-note">'+note+'</div></article>';
  const dotted=s=>{const m=meta(s);return '<span class="badge water-badge"><i class="dot" style="background:'+m.color+'"></i>'+esc(s)+'</span>'};
  // Small evidence badge for 'น้ำขัง' rows: "ยืนยันด้วยภาพ" (confidence สูง) / "ตาม ปภ." (กลาง); nothing for the other statuses.
  const confBadge=r=>{const c=M.waterIsLogged(r)&&M.waterConfidence(r);return c?'<span class="badge water-conf water-conf-'+c.key+'">'+esc(c.label)+'</span>':''};
  const statusCell=r=>dotted(r.status)+(confBadge(r)?' '+confBadge(r):'');

  // ---------- 1. freshness ----------
  function freshnessHtml(rows){
    const f=M.waterFreshness(rows,Date.now());
    const cls=f.runLevel==='bad'?'bad':f.runLevel==='warn'?'warn':'ok';
    let html='<div class="data-age age-'+(cls==='bad'?'bad':'warn')+'" role="status" style="display:block"><b>ความสดของข้อมูล</b> · ประมวลผลรอบล่าสุด '+when(f.runAt)+(f.runHours!=null?' (ผ่านมา '+hoursText(f.runHours)+')':'')
      +' · ภาพดาวเทียมที่พบน้ำล่าสุดมีอายุ '+hoursText(f.imageHours)+' ณ รอบประมวลผลนั้น'
      +'<br><span class="age-basis">ภาพดาวเทียมครอบคลุมเป็นบางส่วนของประเทศ และมาถึงล่าช้าประมาณ 1–2 วัน จังหวัดที่ไม่มีภาพจึงยังไม่ถูกประเมิน</span></div>';
    if(f.runLevel==='bad')html+='<div class="alert">ข้อมูลเก่ากว่า 12 ชั่วโมง อาจมีรอบประมวลผลที่ไม่สำเร็จ อย่าใช้เป็นสถานการณ์ปัจจุบัน</div>';
    else if(f.runLevel==='warn')html+='<div class="alert">ข้อมูลเก่ากว่า 6 ชั่วโมง รอบประมวลผลล่าสุดอาจล่าช้า</div>';
    return html;
  }

  // ---------- 2. cards ----------
  function cardsHtml(rows,districts){
    const s=M.waterSummary(rows);
    const ddpmDistricts=districts.length?M.waterDdpmDistricts(districts):M.waterDdpmDistricts(rows);
    const ddpmOnly=districts.length?M.waterDdpmOnlyCount(districts):null;   // null (no district tab) shows as –, never 0
    return '<div class="cards" aria-live="polite">'
      +card('น้ำขัง (ตำบล)',s.logged,'ยืนยันด้วยภาพ '+fmt(s.image)+' · ตาม ปภ. '+fmt(s.ddpm)+(s.unknownConf?' · ไม่ระบุ '+fmt(s.unknownConf):''),true)
      +card('พบน้ำล่าสุด (ไม่มีภาพใหม่)',s.stale,'ไม่ใช่น้ำขัง และไม่ได้แปลว่าน้ำลด')
      +card('พบน้ำใหม่',s.fresh,'ตำบล พบน้ำในภาพล่าสุดครั้งแรก')
      +card('เฝ้าระวัง / ข้อมูลไม่พอ',s.watch,'ตำบล'+(s.other?' · สถานะอื่น '+fmt(s.other):''))
      +card('อำเภอน้ำขังตาม ปภ. (ไม่มีภาพ)',ddpmOnly,'อำเภอ ในจังหวัดที่ไม่มีภาพดาวเทียมพบน้ำ ใช้ประกาศ ปภ. ระดับอำเภอ')
      +card('อำเภอที่ ปภ. รายงานต่อเนื่อง ≥ 3 วัน',ddpmDistricts,'อำเภอ'+(districts.length?'':' (นับจากรายการตำบล)'))
      +'</div>';
  }

  // ---------- 3. filters ----------
  // Same bar as the other tabs: white card, labelled fields, buttons on the right. The status toggles live above the map.
  function provinceOptions(rows){
    return Array.from(new Set(rows.map(r=>r.province).concat((data()?.floodWaterloggedDistrict||[]).map(r=>r.province),provRows().map(r=>r.province)).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'th'));
  }
  function filtersHtml(rows){
    return '<div class="filters" id="waterFilters" role="search">'
      +'<div class="field"><label for="waterProvince">จังหวัด</label><select id="waterProvince"><option value="">ทุกจังหวัด</option>'+provinceOptions(rows).map(p=>'<option'+(p===state.province?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select></div>'
      +'<div class="field"><label for="waterQuery">ค้นหา</label><input type="search" id="waterQuery" placeholder="ชื่อตำบล อำเภอ หรือจังหวัด" value="'+esc(state.query)+'"></div>'
      +'<span id="waterDistrictChip"></span>'
      +'<button class="lightbtn" id="waterReset" type="button">ล้างตัวกรอง</button>'
      +'<button class="lightbtn" id="waterRefresh" type="button" title="อ่านข้อมูลสดจากชีตอีกครั้ง">รีเฟรชข้อมูล</button>'
      +'<span class="filter-note" id="waterRefreshStatus" aria-live="polite"></span></div>';
  }
  // Status toggles, drawn like the trend cards above the national map (colour dot, label, count) but pressable.
  function statusCardsHtml(rows){
    const counts=new Map();for(const r of rows)counts.set(r.status,(counts.get(r.status)||0)+1);
    return STATUSES.map(st=>'<button type="button" class="trend-card water-status-card" data-water-status="'+esc(st)+'" aria-pressed="'+state.statuses.has(st)+'" title="แสดง/ซ่อน '+esc(st)+'"><i class="dot" style="background:'+meta(st).color+'"></i><span class="tc-label">'+esc(st)+'</span><span class="tc-num">'+fmt(counts.get(st)||0)+'</span></button>').join('');
  }
  function chipHtml(){
    return state.district?'<button type="button" class="lightbtn water-chip" data-water-clear-district title="เอาตัวกรองอำเภอออก">อำเภอ '+esc(state.district.name)+' ('+esc(state.district.province)+') ✕</button>':'';
  }

  // ---------- 4. map ----------
  function provLegendHtml(){
    const rows=provRows();
    if(!rows.length)return '<p class="mini-note water-prov-none">ยังไม่มีข้อมูลสีจังหวัดรอบนี้ (แท็บ flood_2p2r_province) จุดตำบลยังใช้ได้ตามปกติ</p>';
    const c=M.waterProvinceSummary(rows);
    const codes=(window.PROVINCES_GEOJSON?.features||[]).map(f=>M.waterProvCode(f.properties&&f.properties.pro_code)),unmatched=codes.length?M.waterProvinceUnmatched(rows,codes):[];
    const item=k=>{const l=M.WATER_2P2R[k];return '<span class="water-prov-key"><i class="swatch" style="background:'+l.color+'"></i><b>'+l.label+'</b> '+esc(l.phase)+' <span class="mini-note">('+fmt(c[k])+' จังหวัด)</span></span>'};
    return '<div class="map-legend water-prov-legend" aria-label="สีจังหวัด 2P2R">'+['red','orange','yellow','green'].map(item).join('')
      +'<span class="water-prov-key"><i class="swatch swatch-none"></i><b>ปกติ</b> ไม่เติมสี <span class="mini-note">('+fmt(c.normal)+' จังหวัด)</span></span></div>'
      +(unmatched.length?'<p class="mini-note water-prov-note">ไม่พบจังหวัดนี้ในแผนที่ จึงไม่มีสี (ดูได้ในรายการ): '+unmatched.map(r=>esc(r.province)+' ('+esc(r.level)+')').join(', ')+'</p>':'')
      +'<p class="mini-note water-prov-note">แดง = น้ำขังนาน เสี่ยงน้ำเน่าเสีย ไม่ใช่การยืนยันคุณภาพน้ำ · เขียว = ประมาณว่าน้ำลดจากรายงาน ปภ. ไม่ใช่การยืนยัน · สีจังหวัดคือระดับสูงสุดของอำเภอในจังหวัด</p>';
  }
  function mapPanel(rows){
    const legend=STATUSES.map(st=>'<span><i class="dot" style="background:'+meta(st).color+'"></i>'+esc(st)+'</span>').join('')
      +'<span><i class="dot dot-dashed" style="background:'+meta('น้ำขัง').color+'"></i>ขอบประ = น้ำขัง (ตาม ปภ.)</span>';
    return '<section class="panel" id="waterMapPanel"><div class="panel-head"><div><h2>แผนที่น้ำขัง</h2><p class="sub" id="waterMapSub"></p></div><span class="badge" id="waterMapCount">'+fmt(rows.length)+' ตำบล</span></div>'
      +'<div class="trend-cards water-status-cards" role="group" aria-label="กรองตามสถานะ">'+statusCardsHtml(rows)+'</div>'
      +'<div id="waterMap" class="map water-map" role="img" aria-label="แผนที่ตำบลที่พบน้ำ สีตามสถานะ และสีจังหวัดตามระดับ 2P2R"></div>'
      +'<div class="map-legend">'+legend+'</div><div id="waterProvLegend">'+provLegendHtml()+'</div>'
      +'<div class="map-source">ที่มา : GISTDA (ภาพดาวเทียม), กรมป้องกันและบรรเทาสาธารณภัย (ปภ.) · ขอบเขตอำเภอ: OpenGISData-Thailand (ย่อขนาด) · จัดระดับโดย pipeline ไม่ใช่ประกาศทางการ</div></section>';
  }
  // Layer toggle goes into the shared map footer (expand button + layers popover) like the other maps.
  function layerTools(){
    const chip=(id,on,icon,text)=>'<label class="layer-chip"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span class="chip-icon '+icon+'" aria-hidden="true"></span><span class="chip-text">'+text+'</span><span class="chip-check" aria-hidden="true">✓</span></label>';
    const html=(provRows().length?chip('waterProvLayer',state.showProv,'ic-regions','สีจังหวัด 2P2R'):'')+(window.AMPHOE_GEOJSON?chip('waterAmpLayer',state.showAmp,'ic-amphoe','เส้นอำเภอ'):'');
    if(!html)return null;
    const d=document.createElement('div');d.innerHTML=html;
    return d;
  }
  function pointStyle(r,selected){
    const m=meta(r.status);
    const dashed=M.waterIsDashed(r);   // 'น้ำขัง' with medium confidence: same colour, dashed outline
    return {radius:selected?8:5,weight:selected?3:dashed?2:1.2,color:selected?'#0f172a':dashed?'#7f1d1d':'#ffffff',dashArray:dashed&&!selected?'3 2':null,fillColor:m.color,fillOpacity:0.92};
  }
  function drawMap(){
    const el=$('waterMap');if(!el)return;
    // Leaflet may still be loading (slow CDN): try again shortly instead of leaving the map empty.
    if(!window.L){if(mapTries++<40)setTimeout(()=>{if(isOpen&&$('waterMap')===el&&!map)drawMap()},500);return}
    mapTries=0;
    window.MapChrome?.setup(el.closest('section'),el,layerTools());
    destroyMap();
    const m=map=L.map(el,{scrollWheelZoom:false,zoomSnap:0.5,preferCanvas:true}).setView([13.2,100.9],5.5);
    // One canvas renderer for everything: a second canvas on top would swallow the clicks meant for the province polygons below.
    canvas=L.canvas({padding:0.5});
    drawLayers(true);
    const fit=()=>{if(map!==m)return;m.invalidateSize();const s=m.getSize();if(s.x<50||s.y<50)return;fitToPoints()};
    fit();
    if(typeof ResizeObserver!=='undefined'){ro=new ResizeObserver(fit);ro.observe(el)}else{requestAnimationFrame(fit);setTimeout(fit,250)}
  }
  let mapTries=0,fitBounds=null,canvas=null,provLayer=null,ampLayer=null,provByCode=new Map();
  function fitToPoints(){
    if(!map)return;
    if(fitBounds)map.fitBounds(fitBounds,{padding:[20,20],maxZoom:9,animate:false});
  }
  const featCode=f=>M.waterProvCode(f.properties&&f.properties.pro_code);
  function provStyle(f){
    const r=provByCode.get(featCode(f)),lv=r&&state.showProv?M.water2p2rLevel(r):null,sel=!!state.provSel&&featCode(f)===state.provSel;
    return {renderer:canvas,color:sel?'#0f172a':'#94a3b8',weight:sel?2.5:0.7,fillColor:lv&&lv.color?lv.color:'#f1f5f9',fillOpacity:lv&&lv.color?0.62:0.35};
  }
  function provTooltip(f){
    const r=provByCode.get(featCode(f)),name=esc(f.properties.pro_th||'');
    if(!r||!state.showProv)return name;
    const lv=M.water2p2rLevel(r);
    return '<b>'+name+'</b> · '+esc(r.level||lv.label)+(r.phase?' ('+esc(r.phase)+')':'')+(lv.note?'<br><i>'+esc(lv.note)+'</i>':'');
  }
  // Province polygons go first so the tambon points are drawn (and clicked) on top of them.
  function drawProvinces(){
    if(provLayer){provLayer.remove();provLayer=null}
    if(!map||!window.PROVINCES_GEOJSON)return;
    provByCode=provIndex();
    provLayer=L.geoJSON(window.PROVINCES_GEOJSON,{renderer:canvas,style:provStyle,onEachFeature:(f,l)=>{
      l.bindTooltip(()=>provTooltip(f),{sticky:true});
      if(provByCode.has(featCode(f)))l.on('click',()=>chooseProvince(featCode(f)));
    }}).addTo(map);
  }
  // District outlines sit between the province fill and the tambon points. They take no clicks (the provinces below
  // keep theirs) and show from AMP_MIN_ZOOM up, where they no longer blur into one grey mass; the district picked in
  // the district table is outlined at every zoom.
  const AMP_MIN_ZOOM=7;
  function ampStyle(f){
    const sel=!!state.district&&String(f.properties.amp_code)===String(state.district.code);
    const show=state.showAmp&&(sel||(map&&map.getZoom()>=AMP_MIN_ZOOM));
    return {renderer:canvas,interactive:false,fill:false,color:sel?'#0f172a':'#475569',weight:sel?2.5:0.6,opacity:show?(sel?1:0.55):0};
  }
  function drawAmphoes(){
    if(ampLayer){ampLayer.remove();ampLayer=null}
    if(!map||!window.AMPHOE_GEOJSON)return;
    ampLayer=L.geoJSON(window.AMPHOE_GEOJSON,{renderer:canvas,interactive:false,style:ampStyle}).addTo(map);
    map.on('zoomend',restyleAmphoes);
  }
  function restyleAmphoes(){if(ampLayer)ampLayer.setStyle(ampStyle)}
  function drawLayers(refit){drawProvinces();drawAmphoes();drawPoints(refit)}
  // Draws the visible tambons that have a usable coordinate; the rest stay in the list only.
  function drawPoints(refit){
    if(!map)return;
    if(markerLayer)markerLayer.remove();markerLayer=L.layerGroup().addTo(map);markers=new Map();
    const rows=visibleRows(),withPoint=rows.filter(M.waterHasPoint),pts=[];
    // Draw order: less urgent first so the red points end up on top.
    for(const r of withPoint.slice().reverse()){
      const mk=L.circleMarker([r.latitude,r.longitude],{...pointStyle(r,key(r)===state.sel),renderer:canvas}).addTo(markerLayer);
      mk.bindTooltip('<b>'+esc(r.subdistrict||'-')+'</b> · '+esc(r.district||'-')+' · '+esc(r.province)+'<br>'+esc(r.status),{sticky:true});
      mk.on('click',()=>choose(key(r),false));
      markers.set(key(r),mk);pts.push([r.latitude,r.longitude]);
    }
    fitBounds=pts.length?L.latLngBounds(pts):null;
    const missing=rows.length-withPoint.length;
    const cnt=$('waterMapCount');if(cnt)cnt.textContent=fmt(rows.length)+' ตำบล';
    const sub=$('waterMapSub');
    if(sub)sub.textContent='แสดง '+fmt(withPoint.length)+' จาก '+fmt(rows.length)+' ตำบลตามตัวกรอง'+(missing?' · '+fmt(missing)+' ตำบลไม่มีพิกัด จึงไม่แสดงบนแผนที่ (ยังอยู่ในรายการ)':'')+' · กดจุดเพื่อดูรายละเอียด';
    if(refit)fitToPoints();
  }
  function destroyMap(){if(ro){ro.disconnect();ro=null}if(map){map.remove();map=null}markers=new Map();markerLayer=null;fitBounds=null;provLayer=null;ampLayer=null;canvas=null;provByCode=new Map()}

  // ---------- 5. detail ----------
  // Detail panel = selected province (2P2R level, plan, counts, reasons) above the selected tambon.
  function provinceDetailHtml(){
    const row=state.provSel&&provIndex().get(state.provSel);
    if(!row)return '';
    const lv=M.water2p2rLevel(row),reasons=M.reasonList(row.reasons).map(x=>'<li>'+esc(x)+'</li>').join('');
    const stat=(k,v,sub)=>'<div class="stat"><div class="stat-k">'+k+'</div><div class="stat-v">'+v+'</div>'+(sub?'<div class="stat-s">'+sub+'</div>':'')+'</div>';
    const badge='<span class="badge water-badge"><i class="dot" style="background:'+(lv.color||'#e2e8f0')+';border:1px solid #94a3b8"></i>'+esc(row.level||lv.label)+(row.phase?' · '+esc(row.phase):'')+'</span>';
    return '<div class="panel-head"><div><h2>จ.'+esc(row.province)+'</h2><p class="sub">ระดับ 2P2R ของจังหวัด = ระดับสูงสุดของอำเภอในจังหวัด · ข้อมูลรอบ '+when(row.run_at)+'</p></div><div>'+badge+'</div></div>'
      +'<div class="panel-body">'
      +(row.plan?'<p class="water-plan"><b>แนวทาง:</b> '+esc(row.plan)+'</p>':'')
      +(lv.note?'<div class="alert water-level-note" role="note">'+esc(lv.note)+'</div>':'')
      +'<div class="stat-grid">'
        +stat('อำเภอ แดง / ส้ม',fmt(row.red_districts)+' / '+fmt(row.orange_districts),'')
        +stat('อำเภอ เหลือง / เขียว',fmt(row.yellow_districts)+' / '+fmt(row.green_districts),'')
        +stat('ตำบลน้ำขัง',fmt(row.waterlogged_tambons),'ในจังหวัดนี้')
        +stat('ปภ. ต่อเนื่องสูงสุด',Number.isFinite(row.max_ddpm_days)?fmt(row.max_ddpm_days)+' วัน':'–','')
      +'</div>'
      +(reasons?'<h3 class="risk-h">เหตุผลที่ประเมิน</h3><ul class="reason-chips">'+reasons+'</ul>':'')
      +'<p class="mini-note">ตารางตำบลและอำเภอด้านล่างกรองตามจังหวัดนี้อยู่ <button type="button" class="water-link" data-water-clear-province>ล้างตัวกรองจังหวัด</button></p>'
      +'</div>';
  }
  // Default content of the right-hand panel (like the summary table beside the national map): provinces by 2P2R level.

  // One-box summary like the national "situation" panel, with a copy button.
  function dateTh(iso){const t=M.timestamp(iso);return Number.isFinite(t)?new Date(t).toLocaleDateString('th-TH',{...tz,day:'numeric',month:'short',year:'numeric'}):'–'}
  function situationLines(rows,districts){
    const s=M.waterSummary(rows),pv=M.waterProvinceSummary(provRows()),ddpmOnly=districts.length?M.waterDdpmOnlyCount(districts):null;
    const loggedProv=new Set(rows.filter(M.waterIsLogged).map(r=>r.province)).size;
    const lines=['ตำบลน้ำขัง '+fmt(s.logged)+' ตำบล ใน '+fmt(loggedProv)+' จังหวัด (ยืนยันด้วยภาพ '+fmt(s.image)+' · ตาม ปภ. '+fmt(s.ddpm)+')',
      'พบน้ำใหม่ '+fmt(s.fresh)+' ตำบล · พบน้ำล่าสุด (ไม่มีภาพใหม่) '+fmt(s.stale)+' ตำบล · เฝ้าระวัง/ข้อมูลไม่พอ '+fmt(s.watch)+' ตำบล'];
    if(ddpmOnly!=null)lines.push('อำเภอน้ำขังตามประกาศ ปภ. ที่ไม่มีภาพดาวเทียม '+fmt(ddpmOnly)+' อำเภอ');
    if(pv.total)lines.push('สีจังหวัด 2P2R: แดง '+fmt(pv.red)+' · ส้ม '+fmt(pv.orange)+' · เหลือง '+fmt(pv.yellow)+' · เขียว '+fmt(pv.green)+' · ปกติ '+fmt(pv.normal)+' จังหวัด');
    return lines;
  }
  function situationHtml(rows,districts){
    const f=M.waterFreshness(rows,Date.now()),lines=situationLines(rows,districts);
    return '<section class="panel situation" id="waterSituation" aria-label="สรุปสถานการณ์น้ำขัง"><div class="situation-head"><h2>'+dateTh(f.runAt)+' สรุปสถานการณ์น้ำขัง</h2><button type="button" class="lightbtn" data-water-copy>คัดลอกข้อความ</button></div>'
      +'<ul>'+lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>'
      +'<p class="mini-note situation-rule">ไม่ใช่ประกาศทางการ · สีแดง = น้ำขังนาน เสี่ยงน้ำเน่าเสีย (ไม่ใช่การยืนยันคุณภาพน้ำ) · สีเขียว = ประมาณว่าน้ำลด (ไม่ใช่การยืนยัน)</p></section>';
  }
  async function copySituation(button){
    const rows=rowsAll(),f=M.waterFreshness(rows,Date.now());
    const districts=M.waterDistricts(status('flood_waterlogged_district')?.status==='ok'?data().floodWaterloggedDistrict:[]);
    const text=dateTh(f.runAt)+' สรุปสถานการณ์น้ำขัง\n'+situationLines(rows,districts).map(l=>'- '+l).join('\n')+'\n(ไม่ใช่ประกาศทางการ · สีแดง = น้ำขังนาน เสี่ยงน้ำเน่าเสีย ไม่ใช่การยืนยันคุณภาพน้ำ · สีเขียว = ประมาณว่าน้ำลด ไม่ใช่การยืนยัน)';
    let done=false;
    try{await navigator.clipboard.writeText(text);done=true}catch(e){
      try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();done=document.execCommand('copy');ta.remove()}catch(_){}
    }
    const old=button.textContent;button.textContent=done?'คัดลอกแล้ว':'คัดลอกไม่สำเร็จ';setTimeout(()=>{button.textContent=old},1800);
  }

  // ---------- render ----------

      +'<div class="section-title"><div><h2>รายการตำบลที่พบน้ำ</h2><p class="sub" id="waterTableSub"></p></div><button type="button" class="lightbtn" data-water-csv>ดาวน์โหลด CSV</button></div>'
      +'<section class="panel"><div class="table-wrap" id="waterTable"></div></section>'
      +districtPanel(districts)
      +'<section class="panel"><div class="panel-body"><ul class="mini-note water-notes"><li>ไม่ใช่ประกาศอย่างเป็นทางการ ใช้ประกอบการเฝ้าระวังร่วมกับประกาศของหน่วยงานที่รับผิดชอบ</li>'
      +'<li>ไม่เห็นน้ำในภาพ ≠ น้ำลด: ภาพดาวเทียมอาจไม่ครอบคลุมพื้นที่ มีเมฆบัง หรือยังไม่มีภาพใหม่</li>'

      +'<li>"พบน้ำล่าสุด (ไม่มีภาพใหม่)" คือเคยพบน้ำแต่ภาพนั้นเก่าเกินเกณฑ์ของ pipeline และยังไม่มีภาพใหม่ยืนยัน ไม่ใช่สถานะน้ำขัง</li>'

  // Filters change the table, the points and the counts only; the page and the map instance stay.
  function renderTable(){
    const host=$('waterTable');if(!host)return;
    const rows=visibleRows(),T=window.DashboardTables;
    host.innerHTML=tambonTable(rows);

  function markSelectedRow(){
    pane.querySelectorAll('#waterTable tbody tr').forEach(tr=>tr.classList.toggle('sel',!!state.sel&&tr.querySelector('[data-water-sel]')?.dataset.waterSel===state.sel));

  function applyFilters(refit=true){
    $('waterDistrictChip').innerHTML=chipHtml();

    const sel=$('waterProvince');if(sel&&sel.value!==state.province)sel.value=state.province;

  // The province filter (dropdown, map click, reset) also decides which province is highlighted and shown in the detail panel.
  function setProvince(name){

    const row=state.province?provByName(state.province):null;
    state.provSel=row?M.waterProvCode(row.province_code):null;
  }
  function chooseProvince(code){
    const row=provIndex().get(code);if(!row)return;
    setProvince(state.provSel===code?'':row.province);   // clicking the selected province again clears the filter
    applyFilters(true);
    const detail=$('waterDetail');
    if(detail&&state.provSel&&matchMedia('(max-width:900px)').matches)detail.scrollIntoView({behavior:'smooth',block:'start'});
  }

  // Selecting a tambon patches the detail card, the two markers and the table row (no full redraw: scroll and map stay).
  function choose(k,fromTable){
    const r=rowsAll().find(x=>key(x)===k);if(!r)return;
    const prev=state.sel;state.sel=k;
    const detail=$('waterDetail');if(detail)detail.innerHTML=detailHtml();
    const was=prev&&markers.get(prev),now=markers.get(k);
    if(was)was.setStyle(pointStyle(rowsAll().find(x=>key(x)===prev)||r,false));
    if(now){now.setStyle(pointStyle(r,true));now.bringToFront();if(fromTable&&map)map.panTo(now.getLatLng(),{animate:false})}
    markSelectedRow();
    if(detail&&matchMedia('(max-width:900px)').matches)detail.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function csv(rows){
    const cols=[['status','สถานะ'],['confidence','ความมั่นใจ'],['province','จังหวัด'],['district','อำเภอ'],['subdistrict','ตำบล'],['tb_idn','รหัสตำบล'],['run_span_days','พบน้ำต่อเนื่อง (วัน)'],['run_start','เริ่มพบน้ำ'],['run_end','พบน้ำล่าสุด'],['image_age_hours','อายุภาพ (ชม.)'],['detections','จำนวนครั้งที่พบน้ำ'],['latest_area_km2','พื้นที่น้ำล่าสุด (ตร.กม.)'],['in_ddpm','อยู่ในรายงาน ปภ.'],['ddpm_days','ปภ. รายงานต่อเนื่อง (วัน)'],['ddpm_report_date','วันรายงาน ปภ. ล่าสุด'],['latitude','ละติจูด'],['longitude','ลองจิจูด'],['reasons','เหตุผล'],['run_at','รอบข้อมูล']];
    const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
    return '﻿'+[cols.map(c=>cell(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>cell(r[c[0]])).join(','))).join('\r\n');
  }
  // Rows the table currently shows: my filters, then the table's own column filter / search (its row indices refer to the rendered order).
  function exportRows(){
    const rows=visibleRows(),idx=window.DashboardTables?.visibleIndices('waterTable');
    return idx?idx.map(i=>rows[i]).filter(Boolean):rows;
  }

  // Re-reads the three waterlogging tabs (live from the sheet; a tab that fails keeps its previous rows).
  async function readSources(){
    if(typeof requestData!=='function')throw new Error('requestData unavailable');
    for(const [name,k] of Object.entries(M.WATERLOGGED_SOURCES)){
      const next=await requestData(name,true);
      if(next.sourceStatus?.[name]){data().sourceStatus[name]=next.sourceStatus[name];if(next.sourceStatus[name].status==='ok')data()[k]=next[k]}
    }
  }
  async function retry(button){
    button.disabled=true;button.textContent='กำลังอ่าน…';
    try{await readSources()}catch(e){console.warn('waterlogged retry failed',e)}
    render();
  }
  async function refresh(button){
    const out=$('waterRefreshStatus');button.disabled=true;if(out)out.textContent='กำลังอ่านข้อมูล…';
    let ok=true;
    try{await readSources()}catch(e){ok=false;console.warn('waterlogged refresh failed',e)}
    render();
    const o2=$('waterRefreshStatus');if(o2)o2.textContent=ok?'อ่านข้อมูลเมื่อ '+when(new Date().toISOString()):'รีเฟรชไม่สำเร็จ ยังแสดงข้อมูลเดิม';
  }

  function bind(){
    const prov=$('waterProvince');if(prov)prov.addEventListener('change',()=>{setProvince(prov.value);applyFilters()});
    const q=$('waterQuery');if(q)q.addEventListener('input',()=>{state.query=q.value;applyFilters()});
    const reset=$('waterReset');if(reset)reset.addEventListener('click',()=>{state.statuses=new Set(STATUSES);setProvince('');state.query='';state.district=null;$('waterProvince').value='';$('waterQuery').value='';applyFilters()});
  }
  // One delegated listener: pane.innerHTML is rebuilt on every full render, but the pane element itself stays.
  function onClick(e){
    const retryBtn=e.target.closest('[data-water-retry]');if(retryBtn){retry(retryBtn);return}
    const pb=e.target.closest('[data-water-prov]');if(pb){chooseProvince(pb.dataset.waterProv);return}
    const rf=e.target.closest('#waterRefresh');if(rf){refresh(rf);return}
    const cp=e.target.closest('[data-water-copy]');if(cp){copySituation(cp);return}
    if(e.target.closest('[data-water-clear-province]')){setProvince('');applyFilters();return}
    if(e.target.id==='waterProvLayer'){state.showProv=e.target.checked;if(provLayer)provLayer.setStyle(provStyle);return}
    if(e.target.id==='waterAmpLayer'){state.showAmp=e.target.checked;restyleAmphoes();return}
    if(e.target.closest('[data-water-clear-district]')){state.district=null;applyFilters();return}
    const st=e.target.closest('[data-water-status]');
    if(st){const v=st.dataset.waterStatus;if(state.statuses.has(v))state.statuses.delete(v);else state.statuses.add(v);applyFilters();return}
    const sel=e.target.closest('[data-water-sel]');if(sel){choose(sel.dataset.waterSel,true);return}
    const bs=e.target.closest('[data-water-basis]');
    if(bs){state.basis=bs.dataset.waterBasis;renderDistrictTable();return}
    const dist=e.target.closest('[data-water-district]');
    if(dist&&dist.hasAttribute('data-water-ddpm-only')){
      // DDPM-only district: there are no tambons to filter to, so say so instead of showing an empty list.
      state.note={name:dist.dataset.waterDname,province:dist.dataset.waterDprov,days:dist.dataset.waterDdays};renderDistrictTable();return;
    }
    if(dist){state.note=null;const nt=$('waterDistrictNote');if(nt)nt.innerHTML='';state.district={code:dist.dataset.waterDistrict,name:dist.dataset.waterDname,province:dist.dataset.waterDprov};applyFilters();$('waterTable')?.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(e.target.closest('[data-water-csv]')){
      const u=URL.createObjectURL(new Blob([csv(exportRows())],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a');a.href=u;a.download='waterlogged-tambons.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
    }
  }

  pane.addEventListener('click',onClick);
  tab.addEventListener('click',open);
  document.querySelectorAll('.tab').forEach(x=>{if(x!==tab)x.addEventListener('click',close)});
  // dashboard.js re-selects its own tab when it reloads data; the event comes after that, so this tab takes the highlight back.
  window.addEventListener('dashboard:data',()=>{if(isOpen){select(tab);render()}});
})();

</script>
