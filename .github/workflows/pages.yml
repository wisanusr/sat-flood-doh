name: Build and deploy dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # :12 and :42 avoid the top of the hour, when the import script rewrites BKK_water_DB (and :22/:24 for the others).
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on pull requests too (no deploy there), so a broken change is caught before it reaches main.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.cjs
      - run: node test_fetch.cjs
      - run: node flood_web/test_model.cjs
      - run: node flood_web/test_live.cjs
      - run: python3 flood_web/test_server.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news/requirements.txt
      - run: pip install -r news/requirements.txt
      - run: python3 news/test_news.py
      # Generated Apps Script files must match the sources in flood_web/ (run `python build.py` and commit).
      - run: python3 build.py && git diff --exit-code -- . ':!docs'

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news/requirements.txt
      - run: node fetch_data.cjs
      # News and Google Trends are best effort: a blocked feed or a pytrends rate limit must not stop the dashboard deploy.
      # The page shows "no data" for whatever is missing.
      - run: pip install -r news/requirements.txt
        continue-on-error: true
      - run: python3 news/news_scraper.py docs/news_data
        continue-on-error: true
      - run: python3 news/trends_scraper.py docs/news_data
        continue-on-error: true
      - run: python3 build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
